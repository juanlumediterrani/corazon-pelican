[project]
name = "corazon-pelican"
version = "0.1.0"
description = "Mente y taller de Corazón Pelican (procesos fuera del juego)."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.17", "httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["mente", "taller"]

[tool.pytest.ini_options]
testpaths = ["mente/tests", "taller/tests"]
